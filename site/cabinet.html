<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ZAYA — личный кабинет</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
:root{color-scheme:dark;--black:#050505;--gold:#DBB577;--gold-dim:#9C8157;--green:#0B2F23;--cream:#EEE7DA;--mute:#8E887D;--line:rgba(219,181,119,.22);--serif:"Cormorant Garamond",Garamond,Georgia,serif;--sans:"Jost","Avenir Next",Arial,sans-serif;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--black);color:var(--cream);font:300 15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(ellipse 90% 70% at 50% 0%,#0E3829 0%,#071a13 45%,#050505 100%) fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
.shell{max-width:1080px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 0;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px}
.brand img{height:34px;width:auto}
.brand b{font:italic 300 24px/1 var(--serif);color:var(--gold)}
.brand small{display:block;font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--mute)}
.emb .top{padding-right:56px}
.who{display:flex;align-items:center;gap:14px;font-size:12px;letter-spacing:.12em;color:var(--mute)}
.who b{color:var(--cream);font-weight:400}
.lnk{all:unset;cursor:pointer;color:var(--gold);font-size:11px;letter-spacing:.22em;text-transform:uppercase;border-bottom:1px solid rgba(219,181,119,.4);padding-bottom:2px}
.lnk:hover{border-color:var(--gold)}
.lnk:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:1px solid var(--gold);outline-offset:3px}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);font-size:20px;color:var(--gold);line-height:1}
.x:hover{background:rgba(219,181,119,.12)}
.card{border:1px solid var(--line);background:rgba(5,5,5,.55);backdrop-filter:blur(10px);padding:clamp(22px,3vw,36px)}
.login{max-width:520px;margin:clamp(40px,10vh,110px) auto 0;text-align:center}
.login h1{margin:0 0 10px;font:300 clamp(34px,5vw,48px)/1.05 var(--serif)}
.login h1 em{color:var(--gold)}
.login p{margin:0 0 26px;color:#B3AC9E}
.field{display:grid;gap:8px;text-align:left;margin-bottom:16px}
.field label{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold-dim)}
.inp,select.inp,textarea.inp{width:100%;background:rgba(255,255,255,.035);border:1px solid var(--line);padding:13px 14px;border-radius:0;font-size:16px}
.inp:focus{border-color:var(--gold);outline:none}
textarea.inp{min-height:110px;resize:vertical}
select.inp option{background:#0b1a14}
.phone{display:flex;align-items:stretch}
.phone span{display:grid;place-items:center;padding:0 14px;border:1px solid var(--line);border-right:0;color:var(--gold);letter-spacing:.08em;background:rgba(255,255,255,.02)}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;border:1px solid var(--gold);color:var(--gold);font-size:11px;letter-spacing:.26em;text-transform:uppercase;transition:background .4s,color .4s}
.btn:hover{background:rgba(219,181,119,.14)}
.btn.fill{background:var(--gold);color:#0a0a09}
.btn.fill:hover{background:#E7C58A}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn.sm{padding:9px 16px;font-size:10px}
.full{width:100%}
.msg{min-height:22px;margin:12px 0 0;font-size:13px;color:#d9a3a3}
.msg.ok{color:#9fd1b4}
.steps{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:12px;text-align:left;counter-reset:s}
.steps li{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:start;color:#C9C2B3;font-size:14px}
.steps li::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--gold);border-radius:50%;color:var(--gold);font-size:12px}
.code{letter-spacing:.7em;text-align:center;font-size:24px;padding-left:.7em}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:26px 0 24px}
.tab{all:unset;cursor:pointer;padding:11px 20px;border:1px solid var(--line);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mute);position:relative}
.tab[aria-selected="true"]{color:#0a0a09;background:var(--gold);border-color:var(--gold)}
.tab:not([aria-selected="true"]):hover{color:var(--cream);border-color:var(--gold-dim)}
.badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:8px;border-radius:9px;background:#C8563C;color:#fff;font-size:10px;letter-spacing:0}
h2.t{margin:0 0 18px;font:300 clamp(26px,3.4vw,38px)/1.1 var(--serif)}
h3.t{margin:0 0 6px;font:400 22px/1.2 var(--serif)}
.sub{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-dim)}
.qstats{display:flex;gap:10px 22px;flex-wrap:wrap;margin:6px 0 18px;color:#D9D2C4;font-size:14px}
.qstats b{font:400 24px/1 var(--serif);color:var(--gold);margin-right:6px;font-variant-numeric:lining-nums}
.qbar{height:4px;background:rgba(219,181,119,.15);margin:0 0 18px}.qbar i{display:block;height:100%;background:var(--gold)}
.qdots{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.qd{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);font-size:12px;color:var(--mute)}
.qd.done{background:var(--gold);border-color:var(--gold);color:#0a0a09}
.qd.miss{border-color:#C8563C;color:#E58E78}
.qd.sel{box-shadow:0 0 0 2px rgba(219,181,119,.45)}
.qd.lock{opacity:.3;cursor:default}
.qfor{margin:18px 0 0;padding:14px 16px;border-left:2px solid var(--gold);background:rgba(219,181,119,.07)}
.qfor ul{margin:8px 0 0;padding-left:18px;color:#D9D2C4;font-size:14px;line-height:1.6}
.qfor .sub{margin:0}
.kpis{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:6px 0 20px}
.kpi{border:1px solid var(--line);padding:14px 16px;background:rgba(255,255,255,.02)}
.kpi b{display:block;font:400 30px/1.1 var(--serif);color:var(--gold);font-variant-numeric:lining-nums}
.kpi span{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
.dtools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px}
.dtools .inp{width:auto;min-width:140px;flex:1}
.chip{all:unset;cursor:pointer;padding:8px 14px;border:1px solid var(--line);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.chip.on{border-color:var(--gold);color:var(--gold);background:rgba(219,181,119,.08)}
.dl{display:grid;grid-template-columns:1.7fr 1fr .9fr 1.3fr .7fr .6fr;gap:12px;align-items:center;padding:13px 6px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;color:#D9D2C4}
.dl.hd{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute);padding-top:6px;padding-bottom:6px}
.dl.row2{cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;font-family:inherit}
.dl.row2:hover{background:rgba(219,181,119,.06)}
.dl small{display:block;color:var(--mute);font-size:11px}
.dl .bar{height:3px;background:rgba(219,181,119,.16);margin-top:5px}.dl .bar i{display:block;height:100%;background:var(--gold)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:var(--mute)}
.dot.g{background:#7fc79a}.dot.y{background:#DBB577}.dot.r{background:#C8563C}
@media (max-width:820px){.dl{grid-template-columns:1fr 1fr}.dl.hd{display:none}}
.feed{display:grid;gap:0;border-top:1px solid var(--line);max-height:420px;overflow-y:auto}
.feed div{padding:9px 4px;border-bottom:1px solid var(--line);font-size:13px;color:#D9D2C4}.feed small{color:var(--mute);margin-left:8px}
.empty{padding:30px;text-align:center;color:#B3AC9E;border:1px dashed var(--line)}
.empty .acts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.apps{display:grid;gap:18px}
.app .head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline;margin-bottom:20px}
.pill{display:inline-block;padding:4px 12px;border:1px solid var(--gold);color:var(--gold);font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.pill.warn{border-color:#C8563C;color:#E58E78}
.pill.mute{border-color:var(--mute);color:var(--mute)}
.flow{display:flex;gap:0;margin:6px 0 20px}
.flow div{flex:1;position:relative;padding-top:20px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);text-align:center;min-width:0}
.flow div::before{content:"";position:absolute;left:0;right:0;top:6px;height:1px;background:var(--line)}
.flow div::after{content:"";position:absolute;left:50%;top:1px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#071a13;border:1px solid var(--mute)}
.flow div.done{color:#C9C2B3}.flow div.done::before{background:var(--gold)}.flow div.done::after{background:var(--gold);border-color:var(--gold)}
.flow div.now{color:var(--gold)}.flow div.now::before{background:var(--gold)}.flow div.now::after{background:var(--black);border-color:var(--gold);box-shadow:0 0 0 4px rgba(219,181,119,.18)}
.flow.dim{opacity:.4}
dl.kv{display:grid;grid-template-columns:minmax(120px,200px) 1fr;gap:8px 18px;margin:0;font-size:14px}
dl.kv dt{color:var(--gold-dim);font-size:11px;letter-spacing:.16em;text-transform:uppercase;padding-top:3px}
dl.kv dd{margin:0;color:#D9D2C4;word-break:break-word;white-space:pre-wrap}
details summary{cursor:pointer;color:var(--gold);font-size:11px;letter-spacing:.22em;text-transform:uppercase;margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:0 18px}
@media (max-width:720px){.grid2,.grid3{grid-template-columns:1fr}dl.kv{grid-template-columns:1fr;gap:2px}.flow div{font-size:9px;letter-spacing:.06em}}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:14px 0}
.ph{position:relative;aspect-ratio:3/4;background:#0b1a14;border:1px solid var(--line);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{all:unset;cursor:pointer;position:absolute;right:6px;top:6px;width:26px;height:26px;display:grid;place-items:center;background:rgba(5,5,5,.75);border:1px solid var(--line);color:var(--cream)}
.ph button:hover{border-color:#C8563C;color:#E58E78}
.note{font-size:12px;color:var(--mute);margin:8px 0 0}
.chat{display:grid;grid-template-rows:1fr auto;height:min(64vh,560px);min-height:360px}
.log{overflow-y:auto;padding:6px 4px 14px;display:flex;flex-direction:column;gap:10px}
.m{max-width:78%;padding:10px 14px;border:1px solid var(--line);background:rgba(255,255,255,.03);white-space:pre-wrap;word-break:break-word}
.m.me{align-self:flex-end;background:rgba(219,181,119,.12);border-color:rgba(219,181,119,.4)}
.m small{display:block;margin-top:4px;font-size:10px;letter-spacing:.1em;color:var(--mute)}
.compose{display:flex;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.compose textarea{flex:1;min-height:48px;max-height:120px;resize:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.row .inp{width:auto;min-width:150px;flex:1}
.list{display:grid;gap:0;border-top:1px solid var(--line)}
.li{display:grid;grid-template-columns:1.4fr 1fr 1fr .9fr;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.li:hover{background:rgba(219,181,119,.06)}
.li small{display:block;color:var(--mute)}
@media (max-width:720px){.li{grid-template-columns:1fr 1fr}}
.split{display:grid;grid-template-columns:280px 1fr;gap:20px}
@media (max-width:820px){.split{grid-template-columns:1fr}}
.th{display:block;width:100%;text-align:left;padding:12px 14px;border:1px solid var(--line);background:none;margin-bottom:8px;cursor:pointer}
.th.on{border-color:var(--gold);background:rgba(219,181,119,.08)}
.th b{display:block;font-weight:400}
.th small{display:block;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{margin-bottom:16px}
.spin{display:grid;place-items:center;padding:80px;color:var(--mute);letter-spacing:.3em;text-transform:uppercase;font-size:11px}
.ov{position:fixed;inset:0;z-index:20;background:rgba(2,6,4,.92);display:grid;place-items:center;padding:20px}
.ov img{max-width:100%;max-height:100%;object-fit:contain}
</style>
</head>

/* ---------- tiny DOM helper (text only, never innerHTML with data) ---------- */
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  if(attrs)for(const[k,v]of Object.entries(attrs)){
    if(v==null||v===false)continue;
    if(k==="class")e.className=v;
    else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(k==="value")e.value=v;
    else e.setAttribute(k,v===true?"":v);
  }
  for(const c of kids.flat(Infinity))if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));
  return e;
}
const clear=n=>{while(n.firstChild)n.removeChild(n.firstChild)};

/* ---------- API ---------- */
async function api(method,path,body,form){
  const opt={method,headers:{"x-zaya":"1"},credentials:"same-origin"};
  if(form)opt.body=form;
  else if(body){opt.headers["content-type"]="application/json";opt.body=JSON.stringify(body)}
  let res;try{res=await fetch("/api/"+path,opt)}catch(e){return{status:0,data:{ok:false,error:"net"}}}
  let data=null;try{data=await res.json()}catch(e){}
  return{status:res.status,data:data||{ok:false}};
}

/* ---------- render ---------- */
async function render(){
  const me=state.me;
  const isMgr=isStaff(me),isOwner=me.role==="owner";
  const unread=state.data?state.data.unread:0;
  const hasQuest=!isMgr&&state.data&&state.data.quest===true;
  const list=isMgr?[...(isOwner?[["dash",t("tDash")]]:[]),["apps",t("tApps")],["chats",t("tChats")],["quest",t("tQuest")]]:[["apps",t("tApps")],...(hasQuest?[["quest",t("tQuest")]]:[]),["profile",t("tProfile")],["chat",t("tChat"),unread||""]];
  if(!list.some(x=>x[0]===state.tab))state.tab=isOwner?"dash":"apps";
  shell(tabs(list),h("div",{id:"view"},h("div",{class:"spin"},"…")));
  setWho(me);
  const view=document.getElementById("view");let node;
  if(isMgr){
    if(state.tab==="dash")node=await viewDash();
    else if(state.tab==="apps")node=state.openApp?await viewAdminApp(state.openApp):await viewAdminApps();
    else if(state.tab==="quest")node=await viewAdminQuest();
    else node=await viewAdminChats();
  }else{
    node=state.tab==="apps"?viewApps():state.tab==="quest"?await viewQuest():state.tab==="profile"?viewProfile():viewChat();
  }
  clear(view);view.append(node);
}
let lastSync=0;
async function syncSheet(){
  if(!state.me||isStaff(state.me)||!state.data||!state.data.apps.some(a=>a.code))return;
  if(Date.now()-lastSync<120000)return;lastSync=Date.now();
  const r=await api("POST","sync");
  if(r.data.ok&&r.data.synced){await refreshMine();if(state.tab==="apps"&&!state.openApp)render()}
}
async function refreshMine(){const r=await api("GET","my");if(r.data.ok)state.data=r.data}
async function reload(){
  if(!isStaff(state.me)){const r=await api("GET","my");if(r.data.ok)state.data=r.data}
  render();
}
async function boot(){
  const me=await api("GET","me");
  if(!me.data.ok){state.me=null;loginScreen();return}
  state.me=me.data.user;
  if(isStaff(state.me))state.data=null;
  else{const d=await api("GET","my");state.data=d.data.ok?d.data:{apps:[],photos:[],unread:0,user:state.me}}
  state.tab=state.me.role==="owner"?"dash":"apps";state.openApp=null;render();
  syncSheet();
}
boot();
})();
