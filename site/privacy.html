<!doctype html>

<meta charset="utf-8">

<title>Данные — ZAYA</title>
<meta name="description" content="Простыми словами: какие данные собирает сайт zaya.uz, где они хранятся и кто их видит.">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="canonical" href="https://zaya.uz/privacy.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
:root{color-scheme:dark;--black:#050505;--gold:#DBB577;--gold-dim:#9C8157;--green:#0B2F23;--cream:#EEE7DA;--soft:#A39D90;--line:rgba(219,181,119,.22);--gutter:clamp(16px,5vw,64px)}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(120% 80% at 80% -10%,#0E3829 0%,transparent 60%),var(--black);color:var(--cream);font-family:Jost,system-ui,sans-serif;font-weight:300;line-height:1.65;min-height:100vh}
a{color:var(--gold)}
.wrap{max-width:820px;margin:0 auto;padding:clamp(28px,6vw,72px) var(--gutter) 96px}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:clamp(32px,6vw,64px)}
.top a.back{font-size:12px;letter-spacing:.22em;text-transform:uppercase;text-decoration:none;color:var(--gold)}
.lang button{all:unset;cursor:pointer;font-size:12px;letter-spacing:.2em;padding:6px 8px;color:var(--soft)}
.lang button[aria-pressed="true"]{color:var(--gold)}
.lang button:focus-visible,.top a:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.cap{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold-dim)}
h1{font-family:"Cormorant Garamond",serif;font-weight:400;font-size:clamp(38px,7vw,64px);line-height:1.05;margin:12px 0 18px}
h1 em{color:var(--gold);font-weight:300}
h2{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(24px,3.4vw,32px);color:var(--gold);margin:46px 0 10px;line-height:1.15}
p,li{font-size:16px}
ul{padding-left:20px}li{margin:6px 0}
.lead{font-size:18px;color:var(--cream)}
.note{margin-top:46px;padding:18px 20px;border:1px solid var(--line);color:var(--soft);font-size:14px}
.rule{height:1px;background:var(--line);margin:40px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="/" data-i="back">← На сайт</a>
    <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="ru">RU</button><button type="button" data-lang="uz">UZ</button><button type="button" data-lang="en">EN</button></div>
  </div>
  <main id="doc"></main>
</div>

en:{
 back:"← Back to the site",
 title:"How we handle <em>your data</em>",
 kicker:"ZAYA · Data",
 lead:"In plain words: what zaya.uz collects, where it is kept and who can see it.",

var langs=["ru","uz","en"],l="ru";
try{var sv=localStorage.getItem("zaya-lang");if(langs.indexOf(sv)>=0)l=sv}catch(e){}
function draw(){
  var t=T[l];
  document.documentElement.lang=l;
  document.title=(l==="ru"?"Данные":l==="uz"?"Ma’lumotlar":"Data")+" — ZAYA";
  document.querySelector(".back").textContent=t.back;
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.lang===l)});
  var h='<span class="cap"></span><h1>'+t.title+'</h1><p class="lead">'+t.lead+'</p>';
  t.s.forEach(function(x){h+='<h2></h2><ul></ul>'});
  h+='<div class="note"></div>';
  var box=document.getElementById("doc");box.innerHTML=h;
  box.querySelector(".cap").textContent=t.kicker;
  var hs=box.querySelectorAll("h2"),us=box.querySelectorAll("ul");
  t.s.forEach(function(x,i){hs[i].textContent=x[0];x[1].forEach(function(line){var li=document.createElement("li");li.textContent=line;us[i].appendChild(li)})});
  box.querySelector(".note").textContent=t.note;
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){l=b.dataset.lang;try{localStorage.setItem("zaya-lang",l)}catch(e){}draw()})});
draw();
})();
</script>
