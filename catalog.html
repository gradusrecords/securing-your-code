<style>
/* Layout: full-screen WebGL stage in a dark-green void; thin gold UI floats above it. Single dark look by design. */
:root{
  --void-0:#123d2c; --void-1:#082016; --void-2:#030a07;
  --gold:#d9b477; --gold-dim:#a88a58; --paper:#efe7d6; --muted:#9fb0a6;
  --f-display:"Playfair Display", Didot, Georgia, serif;
  --f-body:"Jost", "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
html,body{height:100%;margin:0;background:var(--void-2);color:var(--paper);overflow:hidden}
body{font-family:var(--f-body);font-weight:300;padding-inline:0;padding-block:0}
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 46%,var(--void-0) 0%,var(--void-1) 42%,var(--void-2) 100%)}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
canvas:active{cursor:grabbing}
.ui{position:fixed;left:0;right:0;pointer-events:none;display:flex;justify-content:center;opacity:0;transition:opacity .8s ease}
.ui.on{opacity:1}
.top{top:calc(env(safe-area-inset-top,0px) + 18px);justify-content:space-between;padding-inline:20px}
.brand{display:flex;align-items:center;gap:10px;pointer-events:auto;text-decoration:none;color:inherit}
.right{display:flex;align-items:center;gap:10px}
.site{pointer-events:auto;display:flex;align-items:center;height:34px;padding:0 12px;border:1px solid rgba(217,180,119,.35);color:var(--gold);font-size:11px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;white-space:nowrap}
.embed .site{display:none}
.site:hover{background:rgba(217,180,119,.12)}
.site:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.brand img{width:30px;height:auto}
.brand b{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.08em}
.brand small{display:block;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.lang{display:flex;border:1px solid rgba(217,180,119,.5);pointer-events:auto;height:34px}
.lang button,.nav button,.again{appearance:none;background:transparent;border:0;color:var(--gold);font-family:var(--f-body);font-size:12px;letter-spacing:.18em;cursor:pointer}
.lang button{padding:0 12px;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--gold);color:#0a140f}
.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 22px);flex-direction:column;align-items:center;gap:10px}
.nav{display:flex;align-items:center;gap:6px;pointer-events:auto;background:rgba(5,12,9,.55);border:1px solid rgba(217,180,119,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:4px}
.nav button{width:44px;height:38px;font-size:18px}
.nav button:disabled{opacity:.3;cursor:default}
.nav .count{min-width:150px;text-align:center;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper);font-variant-numeric:tabular-nums}
.hint{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);text-align:center;padding-inline:16px}
.again{pointer-events:auto;border:1px solid rgba(217,180,119,.35);padding:8px 12px;font-size:11px}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#loader{position:fixed;inset:0;display:grid;place-items:center;background:var(--void-2);transition:opacity 1.2s ease;z-index:5}
#loader.gone{opacity:0;pointer-events:none}
#loader div{text-align:center}
#loader img{width:64px;opacity:.9;animation:pulse 1.6s ease-in-out infinite}
#loader p{margin:16px 0 0;font-size:11px;letter-spacing:.4em;text-transform:uppercase;color:var(--muted)}
@keyframes pulse{50%{opacity:.35}}
#skip{position:fixed;right:20px;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);z-index:4;appearance:none;background:transparent;border:1px solid rgba(217,180,119,.35);color:var(--gold);font-family:var(--f-body);font-size:11px;letter-spacing:.2em;padding:8px 12px;cursor:pointer;transition:opacity .6s}
#skip.gone{opacity:0;pointer-events:none}
#err{position:fixed;inset:0;display:none;place-items:center;text-align:center;padding:24px;color:var(--paper);font-size:15px;line-height:1.6}
@media (prefers-reduced-motion:reduce){#loader img{animation:none}}
@media (max-width:560px){.brand small{display:none}.site{padding:0 9px;letter-spacing:.1em}.right{gap:6px}.nav .count{min-width:110px}}
</style>

function spaced(ctx,text,x,y,sp,align){ // manual letter-spacing
  const chars=[...text];let w=0;const ws=chars.map(c=>ctx.measureText(c).width);w=ws.reduce((a,b)=>a+b,0)+sp*(chars.length-1);
  let cx=align==="center"?x-w/2:align==="right"?x-w:x;const prev=ctx.textAlign;ctx.textAlign="left";
  chars.forEach((c,i)=>{ctx.fillText(c,cx,y);cx+=ws[i]+sp});ctx.textAlign=prev;return w}
function wrap(ctx,text,maxW){const words=String(text).split(" ");const lines=[];let line="";
  for(const w of words){const t=line?line+" "+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}
  if(line)lines.push(line);return lines}

/* ---------------- 2D page painter ---------------- */
function star(ctx,cx,cy,r,on){ctx.beginPath();for(let k=0;k<10;k++){const a=-Math.PI/2+k*Math.PI/5,rr=k%2?r*.45:r;ctx.lineTo(cx+Math.cos(a)*rr,cy+Math.sin(a)*rr)}ctx.closePath();
  if(on){const g=ctx.createLinearGradient(cx-r,cy-r,cx+r,cy+r);g.addColorStop(0,"#f3d9a2");g.addColorStop(1,"#b98d4a");ctx.fillStyle=g;ctx.fill()}else{ctx.strokeStyle="rgba(217,180,119,.45)";ctx.lineWidth=1.6;ctx.stroke()}}
// agency score out of 10 (set by the agency): 10 = favourite of the agency (gets a badge), most models 9, the last few in each list 8
const RW=[10,10,9,9,9,9,9,9,9,8,8,8];
const RM=[10,9,10,9,9,9,9,9,9,9,8,8,8];

let LOGO;
const PW=900,PH=1272,u=PW/100;
function folio(ctx,n,label){ctx.fillStyle="#a88a58";ctx.font=FB(1.9*u,400);const y=PH*0.965;
  spaced(ctx,label.toUpperCase(),7*u,y,0.5*u,"left");spaced(ctx,String(n).padStart(2,"0"),PW-7*u,y,0.4*u,"right");
  ctx.globalAlpha=.9;ctx.drawImage(LOGO,PW/2-1.8*u,y-3.2*u,3.6*u,3.6*u*LOGO.height/LOGO.width);ctx.globalAlpha=1}
function greenBg(ctx,cx,cy){const g=ctx.createRadialGradient(PW*cx,PH*cy,10,PW*cx,PH*cy,PH*0.85);g.addColorStop(0,"#17432f");g.addColorStop(.45,"#0d2a1f");g.addColorStop(1,"#06120d");ctx.fillStyle=g;ctx.fillRect(0,0,PW,PH)}
function frame(ctx){ctx.strokeStyle="rgba(217,180,119,.38)";ctx.lineWidth=2;ctx.strokeRect(4*u,4*u,PW-8*u,PH-8*u);ctx.strokeStyle="rgba(217,180,119,.15)";ctx.strokeRect(5.2*u,5.2*u,PW-10.4*u,PH-10.4*u)}
/* ---------------- model photos: photos/<slug>-1.jpg (main), -2.jpg, -3.jpg ---------------- */
/* slug = Latin name in lower case, e.g. "Kamilla Muzrabbekova" -> kamilla-muzrabbekova. Missing files are simply skipped. */
const PHOTOS_OK=location.protocol!=="file:"; // WebGL cannot use local-file images (browser security), so photos need a real site
const slugOf=m=>m[1].toLowerCase().replace(/[‘’'`]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const PHOTO_CACHE={};
const PHOTO_PAGES=new Set(); // pages with real photos: lit lower so bright backdrops are not blown out
function photosFor(m,pg){
  if(!PHOTOS_OK)return [null,null,null];
  const k=slugOf(m);let c=PHOTO_CACHE[k];
  if(!c){
    c=PHOTO_CACHE[k]=[null,null,null];
    for(let j=0;j<3;j++){const im=new Image();im.onload=()=>{c[j]=im;PAGES.forEach((q,ix)=>{if(q.t==="model"&&q.g===pg.g&&q.i===pg.i)refreshPage(ix)})};im.src="photos/"+k+"-"+(j+1)+".jpg"}
  }
  return c;
}
function refreshPage(idx){
  for(const lg of ["ru","uz"]){const key=lg+":"+idx,t=texCache.get(key);if(t){t.dispose();texCache.delete(key)}}
  if(typeof leaves!=="undefined")leaves.forEach((L,i)=>{if(i>0&&L.loaded&&(L.fi===idx||L.bi===idx))loadLeaf(i)});
}
function cover(ctx,img,x,y,w,h,ax,ay){
  const sc=Math.max(w/img.width,h/img.height),iw=img.width*sc,ih=img.height*sc;
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.drawImage(img,x+(w-iw)*ax,y+(h-ih)*ay,iw,ih);ctx.restore();
}

function paint(ctx,idx){

    ctx.fillStyle="#d9b477";ctx.font=FD(10.5*u);spaced(ctx,"ZAYA MG",PW/2,PH*.56,1.4*u,"center");
    ctx.fillStyle="#efe7d6";ctx.font=FB(2.3*u,400);spaced(ctx,"MODEL AGENCY · TASHKENT",PW/2,PH*.6,1.3*u,"center");
    ctx.font=FD(4.8*u,true);ctx.textAlign="center";ctx.fillText(t.slogan,PW/2,PH*.7);
    ctx.fillStyle="#a88a58";ctx.font=FB(2.1*u,400);spaced(ctx,t.ed.toUpperCase(),PW/2,PH*.75,.8*u,"center");
    ctx.fillStyle="#9fb0a6";ctx.font=FB(1.6*u,400);spaced(ctx,t.rights.toUpperCase(),PW/2,PH*.925,.45*u,"center");return}
  if(p.t==="about"){ctx.fillStyle="#0d2a1f";ctx.fillRect(0,0,PW,PH);let x=9*u,y=12*u;
    ctx.fillStyle="#d9b477";ctx.font=FB(2.1*u,400);spaced(ctx,t.aboutEb.toUpperCase(),x,y,.9*u,"left");y+=9*u;
    const H=ABOUT_H[lang];ctx.fillStyle="#efe7d6";ctx.font=FD(7.2*u);ctx.textAlign="left";ctx.fillText(H[0],x,y);y+=8*u;
    ctx.font=FD(7.2*u,true);ctx.fillStyle="#d9b477";ctx.fillText(H[1][0],x,y);const w0=ctx.measureText(H[1][0]).width;
    ctx.font=FD(7.2*u);ctx.fillStyle="#efe7d6";const rest=H[1][1];if(x+w0+ctx.measureText(rest).width<PW-8*u)ctx.fillText(rest,x+w0,y);else{y+=8*u;ctx.fillText(rest.trim(),x,y)}

function worleyTile(size,cells,seed){const r=rnd(seed),pts=[];for(let j=0;j<cells;j++)for(let i=0;i<cells;i++)pts.push([(i+r())/cells,(j+r())/cells]);
  const out=new Float32Array(size*size),cs=1/cells;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){const fx=x/size,fy=y/size,gx=Math.floor(fx*cells),gy=Math.floor(fy*cells);let d1=9,d2=9;
    for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){let cx=gx+ox,cy=gy+oy;const wx=(cx+cells)%cells,wy=(cy+cells)%cells;const p=pts[wy*cells+wx];
      const px=p[0]+(cx-wx)*cs,py=p[1]+(cy-wy)*cs;const dx=fx-px,dy=fy-py,d=dx*dx+dy*dy;if(d<d1){d2=d1;d1=d}else if(d<d2)d2=d}
    out[y*size+x]=(Math.sqrt(d2)-Math.sqrt(d1))*cells}
  return out}
function leatherTiles(){const S=256,a=worleyTile(S,22,7),b=worleyTile(S,9,19);const col=mk(S,S),bmp=mk(S,S),ci=col.getContext("2d").createImageData(S,S),bi=bmp.getContext("2d").createImageData(S,S);
  for(let i=0;i<S*S;i++){const e=Math.min(1,a[i]*2.2),e2=Math.min(1,b[i]*1.4);const h=0.55*e+0.25*e2+0.2; // ridge height
    const v=Math.round(255*clamp(h,0,1));bi.data[i*4]=bi.data[i*4+1]=bi.data[i*4+2]=v;bi.data[i*4+3]=255;
    const k=0.6+0.32*h;ci.data[i*4]=Math.round(9*k);ci.data[i*4+1]=Math.round(36*k);ci.data[i*4+2]=Math.round(25*k);ci.data[i*4+3]=255}
  col.getContext("2d").putImageData(ci,0,0);bmp.getContext("2d").putImageData(bi,0,0);return{col,bmp}}

  const tiles=leatherTiles();const ltex=canvasTex(tiles.col,true);ltex.wrapS=ltex.wrapT=THREE.RepeatWrapping;ltex.repeat.set(1,4);
  const leatherPlain=new THREE.MeshStandardMaterial({map:ltex,roughness:.7,metalness:0,color:0xb8c8bd});
  const ep=endpaperTex();const endMat=new THREE.MeshStandardMaterial({map:ep,roughness:.9});
  const backLeather=leatherPlain;
  const CWd=BW+0.06,CHd=BH+0.08;
  // front cover leaf (index 0)
  const g0=new THREE.BoxGeometry(CWd,CHd,CT);g0.translate(CWd/2-0.01,0,CT/2);
  const front=new THREE.Mesh(g0,[leatherPlain,leatherPlain,leatherPlain,leatherPlain,leather,endMat]);
  const leaf0=new THREE.Group();leaf0.add(front);inner.add(leaf0);
  // glass plaque + gold logo
  const P=ct.plaque,pw=CWd*P.w,ph=CHd*P.h,pcx=-0.01+CWd*P.x,pcy=CHd/2-CHd*P.y;
  const logoTex=new THREE.Texture(LOGO);logoTex.needsUpdate=true;logoTex.encoding=THREE.sRGBEncoding;
  const gold=new THREE.MeshStandardMaterial({map:logoTex,alphaMap:null,transparent:true,alphaTest:.25,metalness:1,roughness:.22,color:0xfff2d8,emissive:0x2a1c08,emissiveMap:logoTex,envMapIntensity:1.6});
  const lw=pw*.62;const logo=new THREE.Mesh(new THREE.PlaneGeometry(lw,lw*LOGO.height/LOGO.width),gold);logo.position.set(pcx,pcy,CT+0.012);leaf0.add(logo);
  const glassGeo=new THREE.BoxGeometry(pw,ph,0.03);
  const glassTop=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:0,roughness:.02,transparent:true,opacity:.05,clearcoat:1,clearcoatRoughness:.02,envMapIntensity:.7,reflectivity:1,depthWrite:false});
  const glassEdge=new THREE.MeshPhysicalMaterial({color:0x8fd0b0,metalness:0,roughness:.06,transparent:true,opacity:.55,envMapIntensity:2,clearcoat:1});
  const glass=new THREE.Mesh(glassGeo,[glassEdge,glassEdge,glassEdge,glassEdge,glassTop,new THREE.MeshBasicMaterial({visible:false})]);glass.position.set(pcx,pcy,CT+0.022);leaf0.add(glass);{const sc=mk(256,256),sx=sc.getContext("2d"),sg=sx.createLinearGradient(0,0,256,256);sg.addColorStop(0,"rgba(255,255,255,0)");sg.addColorStop(.42,"rgba(255,255,255,0)");sg.addColorStop(.5,"rgba(255,255,255,.55)");sg.addColorStop(.56,"rgba(255,255,255,.08)");sg.addColorStop(.7,"rgba(255,255,255,.18)");sg.addColorStop(.74,"rgba(255,255,255,0)");sx.fillStyle=sg;sx.fillRect(0,0,256,256);
  const st=new THREE.Mesh(new THREE.PlaneGeometry(pw,ph),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(sc),transparent:true,opacity:.22,blending:THREE.AdditiveBlending,depthWrite:false}));st.position.set(pcx,pcy,CT+0.0375);leaf0.add(st);leaf0.userData.streak=st}
  const rimMat=new THREE.MeshStandardMaterial({color:0xd9b477,metalness:1,roughness:.28,envMapIntensity:1.6});const rt=0.012;
  [[pw+rt*2,rt,0,ph/2+rt/2],[pw+rt*2,rt,0,-ph/2-rt/2],[rt,ph,-pw/2-rt/2,0],[rt,ph,pw/2+rt/2,0]].forEach(([w,h,dx,dy])=>{const r=new THREE.Mesh(new THREE.BoxGeometry(w,h,0.036),rimMat);r.position.set(pcx+dx,pcy+dy,CT+0.02);leaf0.add(r)});
  leaves.push({g:leaf0,a:0,from:0,to:0,t0:0,dur:1.25,cover:true});
  // page leaves
  const paperDefault=new THREE.MeshStandardMaterial({color:0x0d2a1f,roughness:.85});
  for(let i=1;i<LEAVES;i++){const geo=new THREE.PlaneGeometry(BW,BH,28,1);geo.translate(BW/2,0,0);const base=geo.attributes.position.array.slice();
    const fm=new THREE.MeshStandardMaterial({color:0x0d2a1f,roughness:.82,metalness:0,map:null});const bm=new THREE.MeshStandardMaterial({color:0x0d2a1f,roughness:.82,metalness:0,side:THREE.BackSide,map:null});
    const fMesh=new THREE.Mesh(geo,fm),bMesh=new THREE.Mesh(geo,bm);const g=new THREE.Group();g.add(fMesh,bMesh);inner.add(g);
    leaves.push({g,a:0,from:0,to:0,t0:0,dur:1.05,geo,base,fm,bm,fi:2*(i-1),bi:2*(i-1)+1,loaded:false,bent:false})}
  // back cover (static)
  const gb=new THREE.BoxGeometry(CWd,CHd,CT);gb.translate(CWd/2-0.01,0,-CT/2);inner.add(new THREE.Mesh(gb,[backLeather,backLeather,backLeather,backLeather,endMat,backLeather]));
  // gilded page edges
  const em=new THREE.MeshStandardMaterial({map:edgeTex(),metalness:.85,roughness:.35,color:0xe0c38d,envMapIntensity:1.3});
  edgeR=new THREE.Mesh(new THREE.BoxGeometry(BW*.995,BH*.995,1),em);edgeL=new THREE.Mesh(new THREE.BoxGeometry(BW*.995,BH*.995,1),em);inner.add(edgeR,edgeL);
  // spine
  const sp=new THREE.Mesh(new THREE.CylinderGeometry(1,1,CHd,24,1,true,Math.PI,Math.PI),leatherPlain);sp.rotation.set(0,0,0);inner.add(sp);book.userData.spine=sp;
}

function texWindow(){const lo=Math.max(1,state-2),hi=Math.min(LEAVES-1,state+2);for(let i=1;i<LEAVES;i++){const L=leaves[i];
  if(i>=lo&&i<=hi){if(!L.loaded&&!queue.includes(i))queue.push(i)}
  else if(L.loaded&&(i<state-5||i>state+5)){if(L.bm.map)L.bm.map.dispose();L.fm.map=null;L.bm.map=null;L.fm.emissiveMap=null;L.bm.emissiveMap=null;L.fm.emissive.set(0);L.bm.emissive.set(0);L.fm.color.set(0x0d2a1f);L.bm.color.set(0x0d2a1f);L.fm.needsUpdate=L.bm.needsUpdate=true;L.loaded=false;
    [L.fi,L.bi].forEach(k=>{const key=lang+":"+k;const t=texCache.get(key);if(t){t.dispose();texCache.delete(key)}})}}}
function loadLeaf(i){const L=leaves[i];const ft=pageTexture(L.fi),bt=pageTexture(L.bi).clone();bt.needsUpdate=true;bt.wrapS=THREE.RepeatWrapping;bt.repeat.x=-1;bt.offset.x=1;
  L.fm.map=ft;L.bm.map=bt;L.fm.emissiveMap=ft;L.bm.emissiveMap=bt;L.fm.emissive.set(0xffffff);L.bm.emissive.set(0xffffff);const pf=PHOTO_PAGES.has(L.fi),pb=PHOTO_PAGES.has(L.bi);L.fm.emissiveIntensity=pf?.45:.62;L.bm.emissiveIntensity=pb?.45:.62;L.fm.color.set(pf?0x606060:0x8a8a8a);L.bm.color.set(pb?0x606060:0x8a8a8a);L.fm.needsUpdate=L.bm.needsUpdate=true;L.loaded=true}

function zFor(i,flippedFrac){ // flippedFrac: 0 right stack .. 1 left stack
  const zr=i===0?(LEAVES)*DZ:(LEAVES-i)*DZ, zl=i===0?0:i*DZ;return zr+(zl-zr)*flippedFrac}
function go(n){n=clamp(n,0,LEAVES);if(n===state)return;const now=clock.getElapsedTime();
  const dir=n>state?1:-1;let k=0;
  if(dir>0){for(let i=state;i<n;i++){const L=leaves[i];L.from=L.a;L.to=Math.PI;L.t0=now+k*0.12;L.dir=1;k++}}
  else{for(let i=state-1;i>=n;i--){const L=leaves[i];L.from=L.a;L.to=0;L.t0=now+k*0.12;L.dir=-1;k++}}
  state=n;texWindow();ui()}

function bend(L){const s=Math.sin(L.a),amt=(L.moving?1:0)*s*0.32*(L.dir||1);const p=L.geo.attributes.position.array,b=L.base;
  if(Math.abs(amt)<1e-4){if(L.bent){p.set(b);L.geo.attributes.position.needsUpdate=true;L.geo.computeVertexNormals();L.bent=false}return}
  for(let v=0;v<p.length;v+=3){const x=b[v]/BW;p[v]=b[v]*(1-0.04*Math.abs(amt)*x);p[v+2]=-amt*x*x*BW*0.55}
  L.geo.attributes.position.needsUpdate=true;L.geo.computeVertexNormals();L.bent=true}

function layout(now){let rightCount=0,leftCount=0;
  leaves.forEach((L,i)=>{if(L.to!==undefined){const t=clamp((now-L.t0)/L.dur,0,1);L.moving=t>0&&t<1;L.a=L.from+(L.to-L.from)*ease(t)}
    const f=L.a/Math.PI;L.g.rotation.y=-L.a;L.g.position.z=zFor(i,f)+Math.sin(L.a)*0.05;if(!L.cover)bend(L);
    if(i>0){rightCount+=1-f;leftCount+=f}});
  const hR=Math.max(rightCount-1,0.001)*DZ,hL=Math.max(leftCount-1,0.001)*DZ;
  edgeR.scale.z=hR;edgeR.position.set(BW/2,0,hR/2+DZ*0.2);edgeL.scale.z=hL;edgeL.position.set(-BW/2,0,hL/2+DZ*0.2);
  edgeR.visible=rightCount>1.2;edgeL.visible=leftCount>1.2;
  const sp=book.userData.spine,thick=(LEAVES)*DZ+CT*2,open=clamp(leaves[0].a/Math.PI,0,1);sp.scale.set(0.05,1,thick/2);sp.position.set(-0.01,0,thick/2-CT);sp.visible=open<.05;
  // centre the closed book, centre the spread when open
  const target=state===0?-BW/2:0;inner.position.x+= (target-inner.position.x)*0.06}

function fit(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;dist()}
function dist(){const tan=Math.tan(THREE.MathUtils.degToRad(camera.fov/2));
  const needW=state===0?BW*1.6:BW*2*1.2,needH=BH*1.62;camera.userData.dist=Math.max(needH/(2*tan),needW/(2*tan*camera.aspect));camera.updateProjectionMatrix()}

let mx=0,my=0;
function ui(){const t=UI[lang];$("t-sub").textContent=t.sub;$("site").textContent=t.site;$("hint").textContent=t.hint;$("again").textContent=t.again;
  document.querySelectorAll("[data-lang]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.lang===lang)));
  let label;if(state===0)label=t.cover;else if(state===LEAVES)label=t.end;else{const l=String(2*(state-2)+2).padStart(2,"0"),r=String(2*(state-1)+1).padStart(2,"0");label=state===1?`${r} / ${PAGES.length}`:`${l} · ${r} / ${PAGES.length}`}
  $("count").textContent=label;$("prev").disabled=state===0;$("next").disabled=state===LEAVES;$("ld").textContent=t.load}

function setLang(l){if(l===lang)return;lang=l;try{localStorage.setItem("zaya-lang",l)}catch(e){}
  texCache.forEach(t=>t.dispose());texCache.clear();leaves.forEach((L,i)=>{if(i>0&&L.loaded){L.loaded=false}});
  const ct=coverTextures();const front=leaves[0].g.children[0];const m=front.material[4];["map","roughnessMap","metalnessMap","bumpMap"].forEach(k=>{m[k].dispose();m[k]=ct[k]});m.needsUpdate=true;
  queue=[];texWindow();ui()}

function startIntro(){intro=true;introT=0;skipReq=false;introDone=false;state=0;leaves.forEach(L=>{L.a=0;L.from=0;L.to=0;L.moving=false});
  book.position.set(0,-3.2,-52);book.rotation.set(-1.25,0,0.55);$("top").classList.remove("on");$("bottom").classList.remove("on");$("skip").classList.remove("gone");texWindow();ui()}

function init(){
  const canvas=$("c");try{renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});}catch(e){$("err").style.display="grid";$("loader").classList.add("gone");return}
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.NoToneMapping;renderer.setClearColor(0x000000,0);
  scene=new THREE.Scene();scene.fog=new THREE.Fog(0x072016,14,70);camera=new THREE.PerspectiveCamera(32,1,0.1,200);clock=new THREE.Clock();
  scene.environment=makeEnv();
  scene.add(new THREE.HemisphereLight(0xe4f2ea,0x0a1a12,.5));
  const key=new THREE.DirectionalLight(0xfff1dc,.85);key.position.set(-3,4,6);scene.add(key);
  const rim=new THREE.DirectionalLight(0x9fe0c0,.25);rim.position.set(4,-2,3);scene.add(rim);
  glassLight=new THREE.PointLight(0xfff4e0,2.2,6,2);scene.add(glassLight);
  // golden dust
  const N=reduce?120:520,pos=new Float32Array(N*3),sp=new Float32Array(N);for(let i=0;i<N;i++){pos[i*3]=(Math.random()-.5)*22;pos[i*3+1]=(Math.random()-.5)*12;pos[i*3+2]=-Math.random()*60+4;sp[i]=.05+Math.random()*.15}
  const dg=new THREE.BufferGeometry();dg.setAttribute("position",new THREE.BufferAttribute(pos,3));
  const dotC=mk(64,64),dx=dotC.getContext("2d"),rg=dx.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,"rgba(255,230,170,1)");rg.addColorStop(1,"rgba(255,230,170,0)");dx.fillStyle=rg;dx.fillRect(0,0,64,64);
  dust=new THREE.Points(dg,new THREE.PointsMaterial({size:.07,map:new THREE.CanvasTexture(dotC),transparent:true,opacity:.55,depthWrite:false,blending:THREE.AdditiveBlending,color:0xd9b477}));dust.userData.sp=sp;scene.add(dust);
  buildBook();fit();addEventListener("resize",fit);
  // input
  $("prev").onclick=()=>go(state-1);$("next").onclick=()=>go(state+1);$("again").onclick=()=>startIntro();$("skip").onclick=()=>{skipReq=true};
  document.querySelectorAll("[data-lang]").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
  addEventListener("keydown",e=>{if(!introDone)return;if(e.key==="ArrowRight")go(state+1);if(e.key==="ArrowLeft")go(state-1)});
  let px0=null,pt0=0;canvas.addEventListener("pointerdown",e=>{px0=e.clientX;pt0=performance.now()});
  canvas.addEventListener("pointerup",e=>{if(px0===null||!introDone)return;const dx=e.clientX-px0;px0=null;
    if(Math.abs(dx)>40)go(state+(dx<0?1:-1));else if(performance.now()-pt0<400)go(state+(e.clientX>innerWidth/2?1:-1))});
  addEventListener("pointermove",e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5});
  startIntro();ui();
  setTimeout(()=>$("loader").classList.add("gone"),150);
  renderer.setAnimationLoop(frame)}

function frame(){const dt=Math.min(clock.getDelta(),.05),now=clock.getElapsedTime();
  if(queue.length){loadLeaf(queue.shift())}
  // intro choreography
  if(intro){introT+=dt*(skipReq?6:1);const T1=0.6,T2=4.4,T3=5.1;
    const p=clamp((introT-T1)/(T2-T1),0,1),e=ease(p);
    book.position.set(0,-3.2*(1-e),-52*(1-e));book.rotation.set(-1.25+(1.25-0.12)*e,0,0.55*(1-e)+Math.sin(now*.4)*0.02*(1-e));
    if(introT>T3&&state===0){go(1)}
    if(introT>T3+1.4||(skipReq&&introT>T3+0.2)){intro=false;introDone=true;$("top").classList.add("on");$("bottom").classList.add("on");$("skip").classList.add("gone")}}
  else{book.rotation.x+=((-0.12+my*0.05)-book.rotation.x)*0.05;book.rotation.y+=((mx*0.12)-book.rotation.y)*0.05;book.position.y=Math.sin(now*.6)*0.015}
  // camera
  const d=camera.userData.dist||8;camera.position.x+=(mx*0.35-camera.position.x)*0.04;camera.position.y+=(0.25-my*0.25-camera.position.y)*0.04;camera.position.z+=(d-camera.position.z)*0.06;camera.lookAt(0,-0.34,0);
  dist();
  // light sweep over the glass
  const sw=((now*0.16)%1.4)-0.2;if(leaves[0].g.userData.streak)leaves[0].g.userData.streak.material.opacity=.12+.18*Math.max(0,Math.sin(now*0.9));glassLight.position.set(-2.5+sw*6,1.6-sw*1.2,1.6);
  // dust drift
  const a=dust.geometry.attributes.position.array,sp=dust.userData.sp;for(let i=0;i<sp.length;i++){a[i*3+1]+=sp[i]*dt*.5;if(a[i*3+1]>6)a[i*3+1]=-6}dust.geometry.attributes.position.needsUpdate=true;dust.rotation.y=Math.sin(now*.05)*.1;
  layout(now);renderer.render(scene,camera)}

/* ---------------- boot ---------------- */
(async function boot(){ui();
  LOGO=new Image();LOGO.src=LOGO_SRC;await LOGO.decode().catch(()=>{});
  try{await Promise.race([Promise.all([document.fonts.load(FD(40)),document.fonts.load(FD(40,true)),document.fonts.load(FB(30)),document.fonts.load(FB(30,400)),document.fonts.load(FB(30,500))]),new Promise(r=>setTimeout(r,3500))])}catch(e){}
  for(const k of ["W","M"]){const src=DIVIMG[k];if(src&&src.startsWith("data:")){const im=new Image();im.src=src;try{await im.decode();DIVPIC[k]=im}catch(e){}}}
  if(!window.THREE){$("err").style.display="grid";$("loader").classList.add("gone");return}
  init()})();
</script>
